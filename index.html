<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Eternal Tower — Инвентарь</title>
  <link rel="stylesheet" href="/webapp/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">ETERNAL TOWER</div>
        <h1>Инвентарь</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="Обновить">↻</button>
    </header>

    <section id="playerCard" class="player-card skeleton"></section>

    <section class="equipment">
      <div class="section-title">Экипировка</div>
      <div id="equipmentGrid" class="equipment-grid"></div>
    </section>

    <section class="inventory">
      <div class="inventory-head">
        <div class="section-title">Предметы</div>
        <div id="slots" class="slots"></div>
      </div>
      <div id="filters" class="filters"></div>
      <div id="items" class="items"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="sheet">
      <button id="closeModal" class="close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/webapp/app.js"></script>
</body>
</html>
