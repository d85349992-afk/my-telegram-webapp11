<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Eternal Tower</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><div class="eyebrow">ETERNAL TOWER</div><h1>Профиль</h1></div>
      <button id="closeBtn" class="ghost">✕</button>
    </header>

    <section id="status" class="status">Загрузка данных игрока…</section>

    <section id="profile" class="card hidden">
      <div class="name-row"><div><h2 id="playerName">—</h2><div id="playerRace" class="muted">—</div></div><div id="gold" class="gold">0 🪙</div></div>
      <div class="grid">
        <div class="stat"><span>Этаж</span><b id="floor">—</b></div>
        <div class="stat"><span>Здоровье</span><b id="hp">—</b></div>
        <div class="stat"><span>Энергия</span><b id="energy">—</b></div>
        <div class="stat"><span>Клан</span><b id="clan">—</b></div>
      </div>
      <h3>Характеристики</h3>
      <div class="stats3"><div>💪 <b id="str">0</b><small>Сила</small></div><div>❤️ <b id="end">0</b><small>Выносливость</small></div><div>🏃 <b id="agi">0</b><small>Ловкость</small></div></div>
      <div class="pet" id="pet">🐾 Питомец: —</div>
    </section>

    <section id="inventory" class="card hidden">
      <div class="section-title"><h2>🎒 Инвентарь</h2><span id="slots" class="muted">0/0</span></div>
      <h3>Экипировка</h3>
      <div id="equip" class="list"></div>
      <h3>Зелья</h3>
      <div id="potions" class="list"></div>
      <h3>Предметы</h3>
      <div id="bag" class="list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
